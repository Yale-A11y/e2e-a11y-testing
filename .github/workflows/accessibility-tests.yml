# .github/workflows/accessibility-tests.yml
name: Accessibility Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run accessibility tests daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_url:
        description: 'URL to test (optional)'
        required: false
        default: ''

jobs:
  accessibility-tests:
    name: Run Accessibility Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Run accessibility tests
        env:
          TEST_URL: ${{ github.event.inputs.test_url || 'https://example.com' }}
        run: |
          # Generate sitemap
          npm run sitemap ${{ env.TEST_URL }}
          
          # Run accessibility tests
          npx playwright test tests/axe-sitemap.spec.ts --project=${{ matrix.browser }}
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  visual-regression-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Run visual regression tests
        env:
          TEST_URL: ${{ github.event.inputs.test_url || 'https://example.com' }}
        run: |
          npm run sitemap ${{ env.TEST_URL }}
          npx playwright test tests/visreg-sitemap.spec.ts --project=chromium
        continue-on-error: true

      - name: Upload visual regression results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-results
          path: |
            test-results/
            tests/visreg-sitemap.spec.ts-snapshots/
          retention-days: 7

  generate-report:
    name: Generate Accessibility Report
    runs-on: ubuntu-latest
    needs: [accessibility-tests]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Generate summary report
        run: |
          echo "# Accessibility Test Results" > accessibility-summary.md
          echo "" >> accessibility-summary.md
          echo "## Test Summary" >> accessibility-summary.md
          echo "- **Run Date**: $(date)" >> accessibility-summary.md
          echo "- **Commit**: ${{ github.sha }}" >> accessibility-summary.md
          echo "- **Branch**: ${{ github.ref_name }}" >> accessibility-summary.md
          echo "" >> accessibility-summary.md
          
          # Add more sophisticated reporting logic here
          # You could parse the JSON results and create a detailed report
          
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('accessibility-summary.md')) {
              const summary = fs.readFileSync('accessibility-summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }
